name: Go Build and Test

on:
  workflow_call:
    inputs:
      go-enabled:
        default: false
        required: false
        type: boolean
      go-build-pattern:
        required: false
        type: string
      go-test-pattern:
        default: './...'
        required: false
        type: string
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test-go:
    if: ${{ inputs.go-enabled }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Build Project
        if: ${{ inputs.go-build-pattern != '' }}
        run: go build ${{ inputs.go-build-pattern }}

      - name: Run Tests
        if: ${{ inputs.go-test-pattern != '' }}
        run: go test -race -v ${{ inputs.go-test-pattern }}
