name: goreleaser

on:
  push:
    tags:
      - "*"
  workflow_call:
    inputs:
      environment:
        description: "The environment that the caller uses to store its secrets. This needs to be passed in here to have access to the secrets"
        type: string
        default: "default"
      login_to_dockerhub:
        description: "Controls if the caller needs login to dockerhub"
        required: false
        type: boolean
        default: false
    secrets:
      gpg_private_key:
        description: "The GPG key to be used to sign releases"
        required: true
      passphrase:
        description: "Passphrase for the gpg key"
        required: true
      release_github_token:
        description: "Github token required for creating the release on the repo"
        required: true
      dockerhub_username:
        description: "Dockerhub username that will be used to publish the docker image for the release"
        required: false
      dockerhub_password:
        description: "Dockerhub password that will be used to publish the docker image for the release"
        required: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd
        with:
          gpg_private_key: "${{ secrets.gpg_private_key }}"
          passphrase: "${{ secrets.passphrase }}"
          trust_level: 5
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: 'go.mod'
      - name: Login to Docker Hub
        if: ${{ inputs.login_to_dockerhub }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.dockerhub_username }}
          password: ${{ secrets.dockerhub_password }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.release_github_token }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
