name: goreleaser

on:
  push:
    tags:
      - "*"
  workflow_call:
    secrets:
      gpg_private_key:
        description: "The GPG key to be used to sign releases"
        required: true
      passphrase:
        description: "Passphrase for the gpg key"
        required: true
      release_github_token:
        description: "Github token required for creating the release on the repo"
        required: true

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    environment: default
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec
        with:
          gpg_private_key: "${{ secrets.gpg_private_key }}"
          passphrase: "${{ secrets.passphrase }}"
          trust_level: 5
      - name: Set up Go
        uses: actions/setup-go@d73f6bcfc2b419b74f47075f8a487b40cc4680f8
        with:
          go-version-file: 'go.mod'
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@d31d51ab5501a8d6d0f08c7a080136a1d0adb7a3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.release_github_token }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
