name: Go Build and Test

on:
  workflow_call:
    inputs:
      go-enabled:
        default: false
        required: false
        type: boolean
      go-build-pattern:
        required: false
        type: string
      go-test-pattern:
        default: './...'
        required: false
        type: string
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test-go:
    if: ${{ inputs.go-enabled }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@71cf2267d89c5cb81562390fa70a37fa40b1305e

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Build Project
        if: ${{ inputs.go-build-pattern != '' }}
        run: go build ${{ inputs.go-build-pattern }}

      - name: Run Tests
        if: ${{ inputs.go-test-pattern != '' }}
        run: go test -race -v ${{ inputs.go-test-pattern }}
